name: DAST Security Pipeline (Authenticated)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security_dast_scan:
    runs-on: ubuntu-latest

    services:
      vampi-target:
        image: erev0s/vampi:latest
        ports:
          - 5000:5000

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Ожидание старта сервиса vAmPI
        run: |
          echo "Ожидание старта API..."
          sleep 10
          curl -I http://localhost:5000/openapi.json

      - name: Генерация тестового пользователя и получение JWT токена
        id: get_token
        run: |
          echo "=== Создаем пользователя в vAmPI ==="
          curl -s -X POST http://localhost:5000/users/v1/register \
            -H "Content-Type: application/json" \
            -d '{"username": "security_bot", "password": "Password123!", "email": "bot@test.com"}'

          echo "=== Выполняем логин и получаем токен ==="
          LOGIN_RES=$(curl -s -X POST http://localhost:5000/users/v1/login \
            -H "Content-Type: application/json" \
            -d '{"username": "security_bot", "password": "Password123!"}')
          
          # Вытаскиваем токен через утилиту jq
          TOKEN=$(echo $LOGIN_RES | jq -r .auth_token)
          echo "Токен успешно получен: ${TOKEN:0:15}..."
          
          # Сохраняем токен в переменную окружения шагов
          echo "AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Запуск сканера OWASP ZAP с внедрением токена (DAST)
        run: |
          chmod 777 ${{ github.workspace }}

          # Запускаем ZAP с активными правилами (-a)
          # и правилом Replacer, внедряющим Header авторизации во все запросы
          docker run --rm --network=host -u root -v ${{ github.workspace }}:/zap/wrk/:rw zaproxy/zap-stable:latest \
            zap-api-scan.py -t http://localhost:5000/openapi.json -f openapi -a \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=Bearer\ ${{ env.AUTH_TOKEN }}" \
            -J report.json -r report.html || true

      - name: Security Quality Gate (Анализ отчета)
        run: |
          python3 - << 'EOF'
          import json, sys

          try:
              with open('report.json', 'r') as f:
                  data = json.load(f)

              site = data.get('site', [{}])[0]
              alerts = site.get('alerts', [])
              
              print("=" * 60)
              print(f"[!] Quality Gate: Анализ защищенности REST API (с аутентификацией)...")
              print(f"[!] Всего дефектов найдено: {len(alerts)}")
              print("=" * 60)

              for alert in alerts:
                  risk = alert.get('riskdesc', 'Unknown')
                  name = alert.get('alert', 'Unknown')
                  print(f" -> [{risk}] {name}")

              # Ищем реальные High (3) и Medium (2)
              critical_alerts = [a for a in alerts if int(a.get('riskcode', 0)) >= 2]

              print("=" * 60)
              if critical_alerts:
                  print(f"\n[BLOCKED] Quality Gate: Обнаружены критические уязвимости: {len(critical_alerts)}")
                  print("[FAIL] Сборка отклонена! Найдены дефекты бизнес-логики/валидации.")
                  sys.exit(1)
              
              print("\n[PASSED] Уязвимостей не найдено. Развертывание разрешено.")
              sys.exit(0)

          except Exception as e:
              print(f"Ошибка проверки отчета: {e}")
              sys.exit(1)
          EOF

      - name: Сохранение артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-authenticated-reports
          path: |
            report.html
            report.json
