name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_and_security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Клонирование исходного кода разработчика
        uses: actions/checkout@v4

      - name: 2. Сборка Docker-образа из Dockerfile проекта
        run: |
          echo "Собираем Docker-образ нашего микросервиса..."
          docker build -t my-custom-api:latest .

      - name: 3. Развертывание микросервиса в изолированном контейнере
        run: |
          echo "Запускаем контейнер с API..."
          docker run -d -p 5000:5000 --name api-service my-custom-api:latest
          sleep 5
          # Проверяем, что API поднялся и отдает OpenAPI спецификацию
          curl -I http://localhost:5000/openapi.json

      - name: 4. Динамическое тестирование защищенности (DAST) сканером OWASP ZAP
        run: |
          chmod 777 ${{ github.workspace }}
          echo "Запуск DAST сканера по спецификации http://localhost:5000/openapi.json"
          
          # Запускаем официальный контейнер ZAP с активным сканированием (-a)
          docker run --rm --network=host -u root -v ${{ github.workspace }}:/zap/wrk/:rw zaproxy/zap-stable:latest \
            zap-api-scan.py -t http://localhost:5000/openapi.json -f openapi -a -J report.json -r report.html || true

      - name: 5. Security Quality Gate (Автоматический контроль безопасности)
        run: |
          python3 - << 'EOF'
          import json, sys

          try:
              with open('report.json', 'r') as f:
                  data = json.load(f)

              site = data.get('site', [{}])[0]
              alerts = site.get('alerts', [])
              
              print("=" * 60)
              print(f"[!] Quality Gate: Проверка отчета сканера...")
              print(f"[!] Всего дефектов найдено: {len(alerts)}")
              print("=" * 60)

              for alert in alerts:
                  risk = alert.get('riskdesc', 'Unknown')
                  name = alert.get('alert', 'Unknown')
                  print(f" -> [{risk}] {name}")

              # Ищем критические уязвимости (High = 3, Medium = 2)
              critical_alerts = [a for a in alerts if int(a.get('riskcode', 0)) >= 2]

              print("=" * 60)
              if critical_alerts:
                  print(f"\n[BLOCKED] Quality Gate: Обнаружены опасные уязвимости: {len(critical_alerts)}")
                  print("[FAIL] В исходном коде найдены критические дефекты! Релиз заблокирован.")
                  sys.exit(1)
              
              print("\n[PASSED] Критических уязвимостей не найдено. Сборка одобрена.")
              sys.exit(0)

          except Exception as e:
              print(f"Ошибка проверки отчета: {e}")
              sys.exit(1)
          EOF

      - name: 6. Сохранение отчетов безопасности
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            report.html
            report.json